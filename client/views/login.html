<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<body>
    <div class="login-container">

        <div class="login-card">
            <h2 class="login-title">Sign In </h2>

            <p class="text-muted">
                Don't have an account?
                <a href="register.html">Create now</a>
            </p>

            <form id="loginForm">
                <div class="mb-3 ">
                    <label class="form-label">Email Address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <div class="form-check">
                    <input
                            type="checkbox"
                            class="form-check-input"
                            id="remember"
                    >
                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>

                    </div>

                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <!-- Demo Credentials -->
<div class="alert alert-light py-2 mb-3 small text-muted">
  <strong>Demo Login</strong><br>
  Email: <code>test@example.com</code><br>
  Password: <code>test@123</code>
</div>






                <button type="submit" class="btn-login">
                    Login
                </button>

                <div class="divider">
                    <span>or</span>
                </div>

                <div class="d-flex justify-content-center mb-3 ">
                    <a href="#" class="google-login-btn">
                        <img src="../public/uploads/image.png" alt="Google Icon" class="google-png"> Sign in with Google
                    </a>

                </div>

            </form>
        </div>


            <div class="login-right">
                <img src="../public/uploads/login.png"
                class="login-image"
                alt="Login Image">
            </div>




    </div>
    <script src="../public/js/login.js"></script>
</body>
</html>
