<!doctype html>
<html lang="en">

<head>
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../public/css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body >
    <div class="sidebar">
        <h3 class="logo">Dashboard</h3>

        <div class="top-links">
            <a href="../views/dashboard.html"><i class="bi bi-house-door"></i> Assign </a>
            <a href="../views/tasks.html"><i class="bi bi-people"></i>Tasks </a>
            <a href="#"><i class="bi bi-gear"></i> Settings</a>
        </div>

        <div class="bottom-links">
            <a href="../views/login.html"><i class="bi bi-box-arrow-right"></i>Logout</a>
            <div id="date">
                <span id="today-date"></span>
            </div>

        </div>


    </div>

    <div class="main-content">
        <nav class="navbar navbar-light shadow-sm rounded px-3 mb-4">
            <div class="d-flex align-items-center">
                <button class="btn d-md-none border-0 p-0 me-2" id="sidebarToggle">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <h4 class="m-0">Reports</h4>
            </div>

            <div class="d-flex align-items-center">
                <i class="bi bi-bell fs-4 me-3"></i>
                <div class="d-flex align-items-center me-2">
                    <span id="userName" class="fw-bold me-2 d-none d-sm-inline" style="font-size: 14px; color: #2a4732;"></span>
                </div>
                <img src="../public/uploads/profile.jpg" class="profile-jpg" alt="profile" />
                <!-- Profile Image -->
            </div>
        </nav>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card stat-card">
                    <div>
                        <h6>Total Task Assigned this month</h6>
                        <h3 id="totalTasksCount" style="text-align: center">0</h3>
                    </div>
                    <i class="text-primary fs-1"></i>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <div>
                        <h6>Completed Tasks</h6>
                        <h3 id="completedTasksCount" style="text-align: center">0</h3>
                    </div>
                    <i class="text-primary fs-1"></i>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <div>
                        <h6>Pending Tasks</h6>
                        <h3 id="pendingTasksCount" style="text-align: center">0</h3>
                    </div>
                    <i class="text-primary fs-1"></i>
                </div>
            </div>
        </div>

        <div class="col-md-12 padding-0 mt-4">
            <div class="card p-4 shadow-sm">
                <h5 class="assign-task" >Assign Task</h5>

                <form id="assignTaskForm">
                    <div class="mb-3">
                        <label for="taskName" class="form-label" >Task Name</label>
                        <input type="text" class="form-control" id="taskName" placeholder="Enter task name" autocomplete="off" required/>
                    </div>

                    <div class="mb-3" id="assign">
                        <label for="employee" class="form-label">Assign To</label>
                        <select class="form-select" id="employee" required>
                            <option value="" selected disabled>Select Employee</option>
                        </select>
                    </div>


                    <div class="mb-3 float-end" id="assign">
                        <label for="deadline" class="form-label">Deadline</label>
                        <input type="date" class="form-control" id="deadline" required/>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="3"
                            placeholder="Enter task description"></textarea>
                            <small id="wordCount" class="text-muted position-absolute" 
                                style="bottom: 80px; right: 29px;">0/100</small>
                    </div>

                    <button type="submit" class="btn btn-success" id="assign-btn">Assign Task</button>
                </form>
            </div>
        </div>

        <div class="col-md-12">
            <div class="card shadow-sm p-4 mt-4" >
                <div class="card-header bg-custom">
                    <h5 class="card-title">Recent Tasks</h5>
                    <span onclick="window.location.href='tasks.html'" class="btn btn-success float-end" id="assign-btn"> Show All </span>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Task</th>
                                <th>Due Date</th>
                                <th>Assigned By</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="recentTasksTableBody">
                            <!-- Dynamically loaded -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../public/js/dashboard.js"></script>
</body>

</html>
